services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: broker-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Pas de création implicite de topic (1 partition) par un consommateur ou un
      # producteur : chaque service crée ses topics (NewTopic, 3 partitions).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker-kafka:29092

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    # wal_level=logical est indispensable pour Debezium (CDC)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # Debezium = Kafka Connect + connecteur Postgres + SMT Outbox EventRouter.
  # Le payload outbox contient déjà les octets Avro (format Confluent) : Connect
  # les recopie tels quels, aucun convertisseur Avro n'est donc nécessaire ici.
  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: kafka-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: broker-kafka:29092
      GROUP_ID: kafka-connect-group
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

  conduktor-postgres:
    image: postgres:16
    container_name: conduktor-postgres
    environment:
      POSTGRES_DB: conduktor
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: conduktor
    volumes:
      - conduktor-data:/var/lib/postgresql/data

  conduktor-console:
    image: conduktor/conduktor-console:1.26.0
    container_name: conduktor-console
    depends_on:
      - conduktor-postgres
      - kafka
      - schema-registry
      - kafka-connect
    ports:
      # 8080 est déjà pris par orders-service
      - "8088:8080"
    environment:
      CDK_DATABASE_URL: postgresql://conduktor:conduktor@conduktor-postgres:5432/conduktor
      CDK_ADMIN_EMAIL: admin@admin.io
      CDK_ADMIN_PASSWORD: admin123!
      CDK_CLUSTERS_0_ID: local
      CDK_CLUSTERS_0_NAME: local
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: broker-kafka:29092
      CDK_CLUSTERS_0_SCHEMAREGISTRY_URL: http://schema-registry:8081
      CDK_CLUSTERS_0_KAFKACONNECTS_0_ID: debezium
      CDK_CLUSTERS_0_KAFKACONNECTS_0_NAME: debezium
      CDK_CLUSTERS_0_KAFKACONNECTS_0_URL: http://kafka-connect:8083

  # Mode "desktop" : pas d'écran de login, le serveur Postgres est pré-enregistré
  # (servers.json). Le mot de passe (1234) est demandé à la première connexion.
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: pgadmin
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres-data:
  conduktor-data:
  pgadmin-data:
